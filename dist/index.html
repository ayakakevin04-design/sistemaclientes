<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi App Kawaii de Java ✨</title>
    <!-- Carga de la librería mágica de CheerpJ -->
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
</head>
<body style="margin: 0; background-color: #fff0f5; text-align: center; font-family: sans-serif;">

    <h1 style="color: #ff69b4; margin-top: 20px;">¡Bienvenid@ a mi App! 🌸 (⁠◕⁠‿⁠◕⁠)</h1>
    <p style="color: #888;">Espera un poquitito a que cargue la magia... uwu</p>

    <script>
        async function iniciarApp() {
            // Inicializa la pantalla de Java
            await cheerpjInit();
            cheerpjCreateDisplay(800, 600);
            
            // Ejecuta tu archivo .jar (¡cambia 'tu_programa.jar' por el nombre real de tu archivo!)
            await cheerpjRunJar("/app/tu_programa.jar");
        }
        iniciarApp();
    </script>

</body>
</html>
